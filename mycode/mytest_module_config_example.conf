# MyTest模块配置示例
# 将此配置添加到nginx.conf的http块中

http {
    # ... 其他配置 ...

    server {
        listen 80;
        server_name localhost;

        # 启用MyTest模块的location
        location /mytest {
            mytest_enabled on;  # 启用模块
        }

        # 禁用MyTest模块的location
        location /mytest_disabled {
            mytest_enabled off;  # 禁用模块
        }

        # 默认禁用（不配置mytest_enabled指令）
        location /mytest_default {
            # 默认情况下模块是禁用的
        }
    }
} 